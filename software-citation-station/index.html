<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <link rel="canonical" href="https://flatironinstitute.github.io/software-citation-station/">
  <script>
    // forward to the new home, keeping any query string or anchor so deep links still work
    var target = "https://flatironinstitute.github.io/software-citation-station/";
    window.location.replace(target + window.location.search + window.location.hash);
  </script>
  <!-- fallback for browsers with javascript disabled -->
  <meta http-equiv="refresh" content="0; url=https://flatironinstitute.github.io/software-citation-station/">
</head>
<body>
  <p>The Software Citation Station has moved to
    <a href="https://flatironinstitute.github.io/software-citation-station/">flatironinstitute.github.io/software-citation-station</a>.
  </p>
</body>
</html>
